services:
  postgres:
    image: postgres:15-alpine
    container_name: laughtube_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-laughtube}
      POSTGRES_USER: ${DB_USER:-laughtube_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    networks:
      - laughtube_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-laughtube_user} -d ${DB_NAME:-laughtube}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    container_name: laughtube_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-laughtube}
      DB_USER: ${DB_USER:-laughtube_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      APP_ENV: ${APP_ENV:-production}
      # Ajoutes le 2026-09-03 (voir audit securite) : ces secrets etaient auparavant
      # lus UNIQUEMENT depuis backend/.env, copie en dur dans l'image Docker (COPY . .)
      # sans .dockerignore. Maintenant que backend/.dockerignore exclut .env du build,
      # ils doivent etre fournis ici pour que le conteneur les recoive au demarrage.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY manquant dans .env}
      APP_URL: ${APP_URL:-https://www.laughtube.ca}
      FRONTEND_URL: ${FRONTEND_URL:-https://www.laughtube.ca}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/Laugh_Tube/uploads:/var/www/html/public/uploads
    networks:
      - laughtube_network
    expose:
      - "9000"

  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: laughtube_laravel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/Laugh_Tube/uploads:/var/www/html/public/uploads
    networks:
      - laughtube_network
    environment:
      - APP_ENV=production
      - APP_KEY=${APP_KEY:?APP_KEY manquant dans .env (voir audit securite - cle regeneree)}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_NAME:-laughtube}
      - DB_USERNAME=${DB_USER:-laughtube_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET manquant dans .env}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://www.laughtube.ca/api/v2/auth/google/callback}
      - SESSION_DRIVER=array
      - LIVEKIT_HOST=livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY manquant dans .env}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET manquant dans .env}
      # Ajoute le 2026-09-03 : necessaire pour le nouveau ResendInboundController
      # (webhook mail entrant legal@laughtube.ca, voir rapport de migration 3.2.6)
      - RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY manquant dans .env}

  frontend:
    image: node:20-alpine
    container_name: laughtube_frontend_builder
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/app/dist
      - /app/node_modules
    command: sh -c "npm install && npm run build && cp -r /app/dist/. /dist/"
    restart: "no"

  encoder:
    build:
      context: ./encoder
      dockerfile: Dockerfile
    container_name: laughtube_encoder
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-laughtube}
      - DB_USER=${DB_USER:-laughtube_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      - UPLOADS_DIR=/app/uploads/videos
      - OUTPUT_DIR=/app/uploads/encoded
      - THUMBS_DIR=/app/uploads/thumbnails
      - NODE_ENV=production
    volumes:
      - ./encoder:/app
      - /opt/Laugh_Tube/uploads:/app/uploads
      - /app/node_modules
    networks:
      - laughtube_network
    depends_on:
      postgres:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    container_name: laughtube_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    networks:
      - laughtube_network

  nginx:
    image: nginx:alpine
    container_name: laughtube_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
      - /opt/Laugh_Tube/uploads:/var/www/html/public/uploads:ro
      - frontend_dist:/var/www/frontend:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - laughtube_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  frontend_dist:
    driver: local

networks:
  laughtube_network:
    driver: bridge